cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPortal - Login</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="nav"><b>JobPortal</b></div>
<div class="wrap"><div class="card">
<h2>Login</h2>
<label>Username</label><input id="u" placeholder="admin">
<label>Password</label><input id="p" type="password" placeholder="1234">
<p class="err" id="e">Wrong username or password</p>
<button class="btn" onclick="login()">Login</button>
<p style="font-size:.85rem;color:#556">Demo: admin / 1234</p>
</div></div>
<script>
if(localStorage.getItem('user')) location.href='home.html';
function login(){
  var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  if(u==='admin' && p==='1234'){ localStorage.setItem('user',u); location.href='home.html'; }
  else document.getElementById('e').style.display='block';
}
</script></body></html>
EOF
