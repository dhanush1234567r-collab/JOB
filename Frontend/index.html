<!DOCTYPE html>
<html>
<head>
    <title>Job Portal & Recruitment Platform</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Job Portal & Recruitment Platform</h1>
        <p>Find Your Dream Job</p>
    </header>

    <div class="container">

        <h2>Available Jobs</h2>

        <div class="job-card">
            <h3>AWS DevOps Engineer</h3>
            <p>Company: ABC Technologies</p>
            <p>Location: Chennai</p>
            <p>Salary: ₹4 LPA - ₹6 LPA</p>
            <button onclick="applyJob()">Apply Now</button>
        </div>

        <div class="job-card">
            <h3>Python Developer</h3>
            <p>Company: XYZ Solutions</p>
            <p>Location: Bangalore</p>
            <p>Salary: ₹3 LPA - ₹5 LPA</p>
            <button onclick="applyJob()">Apply Now</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
